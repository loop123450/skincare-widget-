<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#FAF6EE" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Skincare & Supplement Widget</title>
  <style>
    :root {
      --off-white: #FAF6EE;
      --off-white-pure: #FFFFFF;
      --pastel-green: #D6E8D0;
      --pastel-green-dark: #A9CCA0;
      --amber: #D97706;
      --amber-bright: #F59E0B;
      --amber-soft: #FEF3C7;
      --text-main: #1C1917;
      --text-sub: #44403C;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 700;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      margin: 0;
      padding: 0;
      background-color: var(--off-white);
      color: var(--text-main);
      overflow: hidden;
      user-select: none;
    }

    /* Full-bleed wrapper that stretches to fill 100% of the widget */
    .widget-shell {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background-color: var(--off-white);
      padding: 10px;
      gap: 8px;
    }

    /* Top Header Section */
    .header-box {
      background-color: var(--pastel-green);
      border: 2px solid var(--pastel-green-dark);
      border-radius: 14px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex-shrink: 0;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    .day-tag {
      background-color: var(--amber);
      color: var(--off-white);
      font-size: 0.68rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 4px 8px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .header-actions {
      display: flex;
      gap: 6px;
    }

    .action-btn {
      background-color: var(--off-white);
      color: var(--text-main);
      border: 2px solid var(--amber);
      font-size: 0.68rem;
      padding: 3px 8px;
      border-radius: 8px;
      cursor: pointer;
    }

    .action-btn.active {
      background-color: var(--amber-bright);
      color: var(--off-white);
    }

    .routine-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1.2;
    }

    .routine-subtitle {
      font-size: 0.74rem;
      color: var(--text-sub);
      line-height: 1.25;
    }

    /* Scrollable / Stretchable Table-Like Steps List */
    .steps-table {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .steps-table::-webkit-scrollbar {
      width: 4px;
    }

    .steps-table::-webkit-scrollbar-thumb {
      background: var(--pastel-green-dark);
      border-radius: 4px;
    }

    /* Individual Step Row */
    .step-row {
      flex: 1;
      min-height: 54px;
      background-color: var(--pastel-green);
      border: 2px solid var(--pastel-green-dark);
      border-radius: 12px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: transform 0.1s ease, opacity 0.15s ease;
    }

    .step-row:active {
      transform: scale(0.99);
    }

    /* Special Amber Highlight Row for Vitamin C & E */
    .step-row.supplement-row {
      background-color: var(--amber-soft);
      border: 2px solid var(--amber-bright);
    }

    .step-row.completed {
      opacity: 0.6;
    }

    .step-row.completed .step-name {
      text-decoration: line-through;
    }

    /* Custom Amber Checkbox / Icon Box */
    .check-box {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      background-color: var(--off-white);
      border: 2.5px solid var(--amber);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--off-white);
      font-size: 0.9rem;
    }

    .step-row.completed .check-box {
      background-color: var(--amber);
      color: var(--off-white);
    }

    .step-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .step-name {
      font-size: 0.84rem;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1.2;
    }

    .step-desc {
      font-size: 0.72rem;
      color: var(--text-sub);
      line-height: 1.2;
    }

    .badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 3px;
    }

    .amber-badge {
      background-color: var(--amber);
      color: var(--off-white);
      font-size: 0.65rem;
      padding: 2px 7px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    /* Bottom Navigation Bar */
    .footer-bar {
      background-color: var(--pastel-green);
      border: 2px solid var(--pastel-green-dark);
      border-radius: 12px;
      padding: 6px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .days-nav {
      display: flex;
      gap: 3px;
      flex: 1;
      justify-content: space-between;
    }

    .day-btn {
      flex: 1;
      text-align: center;
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 0.7rem;
      padding: 5px 2px;
      border-radius: 7px;
      cursor: pointer;
    }

    .day-btn.active {
      background-color: var(--amber);
      color: var(--off-white);
    }

    .ampm-toggle {
      display: flex;
      background-color: var(--off-white);
      border: 2px solid var(--amber);
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .ampm-btn {
      border: none;
      background: transparent;
      color: var(--text-main);
      font-size: 0.7rem;
      padding: 4px 8px;
      cursor: pointer;
    }

    .ampm-btn.active {
      background-color: var(--amber);
      color: var(--off-white);
    }
  </style>
</head>
<body>
  <div class="widget-shell">
    <!-- Header -->
    <div class="header-box">
      <div class="header-top">
        <span class="day-tag" id="dayBanner">LOADING...</span>
        <div class="header-actions">
          <button class="action-btn active" id="liveAutoBtn" onclick="enableLiveAuto()">● Live Auto</button>
          <button class="action-btn" onclick="resetChecks()">Reset</button>
        </div>
      </div>
      <div class="routine-title" id="routineTitle">Skincare & Supplements</div>
      <div class="routine-subtitle" id="routineSubtitle">Daily barrier & antioxidant protocol</div>
    </div>

    <!-- Steps Table -->
    <div class="steps-table" id="stepsContainer"></div>

    <!-- Footer Controls -->
    <div class="footer-bar">
      <div class="days-nav" id="daysNav"></div>
      <div class="ampm-toggle">
        <button class="ampm-btn" id="amBtn" onclick="setPeriod('AM')">AM</button>
        <button class="ampm-btn" id="pmBtn" onclick="setPeriod('PM')">PM</button>
      </div>
    </div>
  </div>

  <script>
    const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
    const FULL_DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];

    const ROUTINES = {
      AM: {
        tag: "MORNING SHIELD",
        title: "Antioxidant & Sebum Control AM",
        subtitle: "Internal Vitamin C + E synergy & lightweight barrier protection",
        steps: [
          {
            id: "supp-am",
            isSupplement: true,
            name: "💊 Take Vitamin C + Vitamin E",
            desc: "Eat with breakfast containing healthy fats. Vitamin C regenerates Vitamin E & boosts UV defense.",
            badge: "⚡ Peak Absorption Time (8:00–10:00 AM)"
          },
          {
            id: "am-1",
            name: "1. Gentle Cleanser & Pat Bone-Dry",
            desc: "Wash away overnight oil and pat gently with a clean tissue.",
            badge: null
          },
          {
            id: "am-2",
            name: "2. Minimalist Niacinamide 10%",
            desc: "Apply 2–3 drops evenly across face to regulate daytime sebum & pores.",
            badge: "⏱ Wait 2 mins to absorb"
          },
          {
            id: "am-3",
            name: "3. Aloe Vera Gel + Broad-Spectrum SPF",
            desc: "Lock in light hydration, then seal with sunscreen before stepping out.",
            badge: "☀️ UV Shield Required"
          }
        ]
      },
      PM: {
        0: { // Sunday
          tag: "RECOVERY",
          title: "Barrier & Sebum Reset Night",
          subtitle: "Calm acne inflammation & balance oil without over-exfoliating",
          steps: [
            {
              id: "pm-sun-1",
              name: "1. Wash & Pat 100% Bone-Dry",
              desc: "Press a clean tissue on any oily spots or patches so skin stays dry.",
              badge: null
            },
            {
              id: "pm-sun-2",
              name: "2. Hydrocolloid Tape (If Needed)",
              desc: "Apply onto active whiteheads first before any slippery serum.",
              badge: null
            },
            {
              id: "pm-sun-3",
              name: "3. Minimalist Niacinamide 10%",
              desc: "Apply 2–3 drops around any tape. Pat gently and let settle.",
              badge: "⏱ Wait 3 mins to absorb"
            },
            {
              id: "pm-sun-4",
              name: "4. Aloe Vera Gel (5mm Layer)",
              desc: "Lock in water hydration overnight so oil glands stay calm.",
              badge: null
            },
            {
              id: "supp-pm-check",
              isSupplement: true,
              name: "💊 Vitamin C + E (Missed AM Check)",
              desc: "If you skipped breakfast supplements, take them now with dinner.",
              badge: "🔄 Backup Window"
            }
          ]
        },
        EXFOLIATE: { // Mon, Wed, Fri
          tag: "PORE CLEAR",
          title: "Salicylic Acid BHA Clear Night",
          subtitle: "Unclog deep congestion & prevent new breakouts",
          steps: [
            {
              id: "pm-bha-1",
              name: "1. Cleanser & Pat 100% Bone-Dry",
              desc: "Damp skin makes acids penetrate too fast—pat completely dry first.",
              badge: "⏱ Wait 2 mins until dry"
            },
            {
              id: "pm-bha-2",
              name: "2. Salicylic Acid 2% (BHA)",
              desc: "Apply 2–3 drops on T-zone and congested areas. Avoid eye corners.",
              badge: "⏱ Wait 10 mins for BHA action"
            },
            {
              id: "pm-bha-3",
              name: "3. Soothing Aloe Vera Gel Layer",
              desc: "Apply a generous layer to cool and hydrate post-exfoliation.",
              badge: null
            },
            {
              id: "supp-pm-check",
              isSupplement: true,
              name: "💊 Vitamin C + E (Missed AM Check)",
              desc: "Confirm you took your morning Vitamin C + E dose (take with dinner if missed).",
              badge: "🔄 Daily Check"
            }
          ]
        },
        BARRIER: { // Tue, Thu, Sat
          tag: "BARRIER REPAIR",
          title: "Niacinamide & Hydration Night",
          subtitle: "Strengthen skin barrier & fade post-acne marks",
          steps: [
            {
              id: "pm-bar-1",
              name: "1. Gentle Wash & Pat Bone-Dry",
              desc: "Remove sweat, sunscreen, and pollution thoroughly.",
              badge: null
            },
            {
              id: "pm-bar-2",
              name: "2. Hydrocolloid Patch (If Active Spots)",
              desc: "Stick onto clean, dry blemishes before applying serums.",
              badge: null
            },
            {
              id: "pm-bar-3",
              name: "3. Minimalist Niacinamide 10%",
              desc: "Apply 2–3 drops evenly to calm redness and repair barrier lipids.",
              badge: "⏱ Wait 3 mins to absorb"
            },
            {
              id: "pm-bar-4",
              name: "4. Aloe Vera Gel Seal",
              desc: "Smooth over face to lock in overnight moisture.",
              badge: null
            },
            {
              id: "supp-pm-check",
              isSupplement: true,
              name: "💊 Vitamin C + E (Missed AM Check)",
              desc: "Confirm you took your morning Vitamin C + E dose (take with dinner if missed).",
              badge: "🔄 Daily Check"
            }
          ]
        }
      }
    };

    let currentDay = new Date().getDay();
    let currentPeriod = new Date().getHours() < 16 ? "AM" : "PM";
    let isLiveAuto = true;

    function getTodayKey() {
      const d = new Date();
      return `skincare_checks_${d.getFullYear()}_${d.getMonth()}_${d.getDate()}`;
    }

    function getSavedChecks() {
      try {
        return JSON.parse(localStorage.getItem(getTodayKey())) || {};
      } catch {
        return {};
      }
    }

    function toggleStep(stepId) {
      const checks = getSavedChecks();
      checks[stepId] = !checks[stepId];
      try {
        localStorage.setItem(getTodayKey(), JSON.stringify(checks));
      } catch (e) {}
      render();
    }

    function resetChecks() {
      try {
        localStorage.removeItem(getTodayKey());
      } catch (e) {}
      render();
    }

    function enableLiveAuto() {
      isLiveAuto = true;
      const now = new Date();
      currentDay = now.getDay();
      currentPeriod = now.getHours() < 16 ? "AM" : "PM";
      render();
    }

    function setDay(dayIndex) {
      isLiveAuto = false;
      currentDay = dayIndex;
      render();
    }

    function setPeriod(period) {
      isLiveAuto = false;
      currentPeriod = period;
      render();
    }

    function getRoutineData(day, period) {
      if (period === "AM") return ROUTINES.AM;
      if (day === 0) return ROUTINES.PM[0];
      if (day === 1 || day === 3 || day === 5) return ROUTINES.PM.EXFOLIATE;
      return ROUTINES.PM.BARRIER;
    }

    function render() {
      const routine = getRoutineData(currentDay, currentPeriod);
      const checks = getSavedChecks();

      // Update Header
      document.getElementById("dayBanner").textContent =
        `${FULL_DAYS[currentDay].toUpperCase()} ${currentPeriod} • ${routine.tag}`;
      document.getElementById("routineTitle").textContent = routine.title;
      document.getElementById("routineSubtitle").textContent = routine.subtitle;

      const liveBtn = document.getElementById("liveAutoBtn");
      liveBtn.classList.toggle("active", isLiveAuto);

      // Render Steps
      const container = document.getElementById("stepsContainer");
      container.innerHTML = "";

      routine.steps.forEach((step) => {
        const isDone = !!checks[step.id];
        const row = document.createElement("div");
        row.className = `step-row ${step.isSupplement ? "supplement-row" : ""} ${isDone ? "completed" : ""}`;
        row.onclick = () => toggleStep(step.id);

        row.innerHTML = `
          <div class="check-box">${isDone ? "✓" : ""}</div>
          <div class="step-info">
            <div class="step-name">${step.name}</div>
            <div class="step-desc">${step.desc}</div>
            ${step.badge ? `<div class="badge-row"><span class="amber-badge">${step.badge}</span></div>` : ""}
          </div>
        `;
        container.appendChild(row);
      });

      // Render Footer Day Buttons
      const daysNav = document.getElementById("daysNav");
      daysNav.innerHTML = "";
      DAYS.forEach((dayName, idx) => {
        const btn = document.createElement("button");
        btn.className = `day-btn ${idx === currentDay ? "active" : ""}`;
        btn.textContent = dayName;
        btn.onclick = () => setDay(idx);
        daysNav.appendChild(btn);
      });

      // Update AM/PM Toggle
      document.getElementById("amBtn").classList.toggle("active", currentPeriod === "AM");
      document.getElementById("pmBtn").classList.toggle("active", currentPeriod === "PM");
    }

    // Auto-refresh time check every minute when in Live Auto mode
    setInterval(() => {
      if (isLiveAuto) {
        const now = new Date();
        currentDay = now.getDay();
        currentPeriod = now.getHours() < 16 ? "AM" : "PM";
        render();
      }
    }, 60000);

    render();
  </script>
</body>
</html>
