<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f1714" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Skincare" />
  <title>Skincare Routine Widget</title>
  <style>
    :root {
      --bg: #0f1714;
      --card: #17231e;
      --card-border: #263830;
      --accent: #34d399;
      --accent-soft: rgba(52, 211, 153, 0.14);
      --warn: #fbbf24;
      --warn-soft: rgba(251, 191, 36, 0.14);
      --text: #f1f5f3;
      --muted: #8fa69b;
      --done: #4b6358;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 14px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .widget {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 22px;
      padding: 18px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 14px;
    }

    .badge-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 4px;
    }

    .time-badge {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 4px 9px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
    }

    .time-badge.bha-night {
      background: var(--warn-soft);
      color: var(--warn);
    }

    .live-dot {
      font-size: 11px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .live-dot::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      display: inline-block;
    }

    h1 {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.25;
    }

    .subtitle {
      font-size: 12.5px;
      color: var(--muted);
      margin-top: 3px;
    }

    .reset-btn {
      background: #21322b;
      border: 1px solid var(--card-border);
      color: var(--text);
      font-size: 11px;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 10px;
      cursor: pointer;
      white-space: nowrap;
    }

    .steps {
      display: flex;
      flex-direction: column;
      gap: 9px;
      margin-top: 12px;
    }

    .step {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .step.completed {
      opacity: 0.48;
      background: rgba(0, 0, 0, 0.15);
    }

    .checkbox {
      width: 22px;
      height: 22px;
      border-radius: 7px;
      border: 2px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
      font-size: 13px;
      font-weight: 800;
      color: #0b1310;
    }

    .step.completed .checkbox {
      background: var(--accent);
    }

    .step-content {
      flex: 1;
    }

    .step-title {
      font-size: 14.5px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .step.completed .step-title {
      text-decoration: line-through;
      color: var(--muted);
    }

    .step-desc {
      font-size: 12px;
      color: var(--muted);
      margin-top: 3px;
      line-height: 1.35;
    }

    .timer-btn {
      margin-top: 7px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px solid rgba(52, 211, 153, 0.3);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
    }

    .controls {
      margin-top: 15px;
      padding-top: 12px;
      border-top: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .day-pills {
      display: flex;
      gap: 4px;
    }

    .pill {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      padding: 5px 7px;
      border-radius: 8px;
      cursor: pointer;
    }

    .pill.active {
      background: var(--accent);
      color: #0b1310;
      border-color: var(--accent);
    }

    .ampm-toggle {
      display: flex;
      background: #0f1714;
      border-radius: 9px;
      padding: 2px;
      border: 1px solid var(--card-border);
    }

    .ampm-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 9px;
      border-radius: 7px;
      cursor: pointer;
    }

    .ampm-btn.active {
      background: #23352d;
      color: var(--text);
    }
  </style>
</head>
<body>

<div class="widget">
  <div class="header">
    <div>
      <div class="badge-row">
        <span id="routineBadge" class="time-badge">LOADING...</span>
        <span id="liveIndicator" class="live-dot">Live Auto</span>
      </div>
      <h1 id="routineTitle">Skincare Routine</h1>
      <p id="routineSubtitle" class="subtitle"></p>
    </div>
    <button class="reset-btn" id="syncNowBtn">Sync Now</button>
  </div>

  <div id="stepsContainer" class="steps"></div>

  <div class="controls">
    <div class="day-pills" id="dayPills"></div>
    <div class="ampm-toggle">
      <button class="ampm-btn" id="amBtn">AM</button>
      <button class="ampm-btn" id="pmBtn">PM</button>
    </div>
  </div>
</div>

<script>
  const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  const FULL_DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  // Mon (1), Wed (3), Fri (5) are Salicylic Acid 2% nights
  const BHA_DAYS = [1, 3, 5];

  let selectedDay = 0;
  let selectedPeriod = "AM"; // "AM" or "PM"
  let isLive = true;
  let activeTimerInterval = null;

  function getEffectiveDayAndPeriod() {
    const now = new Date();
    const hour = now.getHours();
    let day = now.getDay();

    // 5:00 AM to 4:59 PM = Morning (AM)
    // 5:00 PM to 4:59 AM = Evening (PM)
    // If between 12:00 AM and 4:59 AM, keep it on the previous evening's routine
    if (hour >= 5 && hour < 17) {
      return { day, period: "AM" };
    } else {
      if (hour < 5) {
        day = (day + 6) % 7;
      }
      return { day, period: "PM" };
    }
  }

  function getRoutineData(dayIndex, period) {
    const dayName = FULL_DAYS[dayIndex];

    if (period === "AM") {
      return {
        badge: `${dayName} Morning`,
        isBha: false,
        title: "Daily Oil Control & Protect",
        subtitle: "Keep skin matte, calm redness & hydrate light",
        steps: [
          {
            id: "am-1",
            title: "1. Wash & Pat Dry",
            desc: "Cleanse off overnight oil and pat skin dry."
          },
          {
            id: "am-2",
            title: "2. Minimalist Niacinamide 10%",
            desc: "Apply 2–3 drops across face to slow oil output all day.",
            timerSec: 60
          },
          {
            id: "am-3",
            title: "3. Aloe Vera Gel (Thin Layer)",
            desc: "Use a pea-sized amount for oil-free water hydration."
          },
          {
            id: "am-4",
            title: "4. Sunscreen (SPF 50)",
            desc: "Essential protection, especially on days after Salicylic Acid."
          }
        ]
      };
    }

    const isBhaNight = BHA_DAYS.includes(dayIndex);

    if (isBhaNight) {
      return {
        badge: `${dayName} Night • BHA Unclog`,
        isBha: true,
        title: "Pore-Clearing Night (Salicylic 2%)",
        subtitle: "Dissolve deep pore oil & congestion • Skip Niacinamide tonight",
        steps: [
          {
            id: "pm-bha-1",
            title: "1. Wash & Pat 100% Bone-Dry",
            desc: "Skin must be completely dry so acid doesn't sting and tape sticks."
          },
          {
            id: "pm-bha-2",
            title: "2. Hydrocolloid Tape (If Needed)",
            desc: "Stick directly onto surfaced whiteheads FIRST. Never apply acid under tape."
          },
          {
            id: "pm-bha-3",
            title: "3. Salicylic Acid 2% Serum",
            desc: "Apply 2–3 drops around any tape. Wait 2 mins to absorb into pores.",
            timerSec: 120
          },
          {
            id: "pm-bha-4",
            title: "4. Aloe Vera Gel (Generous Layer)",
            desc: "Apply a soothing layer over face (avoiding tape edges) to rehydrate."
          }
        ]
      };
    } else {
      return {
        badge: `${dayName} Night • Recovery`,
        isBha: false,
        title: "Barrier & Sebum Reset Night",
        subtitle: "Calm acne inflammation & balance oil without over-exfoliating",
        steps: [
          {
            id: "pm-rec-1",
            title: "1. Wash & Pat 100% Bone-Dry",
            desc: "Press a clean tissue on any oily spots so patches adhere tightly."
          },
          {
            id: "pm-rec-2",
            title: "2. Hydrocolloid Tape (If Needed)",
            desc: "Apply onto active whiteheads first before any slippery serum."
          },
          {
            id: "pm-rec-3",
            title: "3. Minimalist Niacinamide 10%",
            desc: "Apply 2–3 drops around any tape. Pat gently and let settle 1 min.",
            timerSec: 60
          },
          {
            id: "pm-rec-4",
            title: "4. Aloe Vera Gel (Even Layer)",
            desc: "Lock in water hydration overnight so oil glands stay calm."
          }
        ]
      };
    }
  }

  function getStorageKey(dayIndex, period) {
    const now = new Date();
    const dateKey = `${now.getFullYear()}-${now.getMonth()}-${dayIndex}-${period}`;
    return `skincare_done_${dateKey}`;
  }

  function getCompletedMap(dayIndex, period) {
    try {
      return JSON.parse(localStorage.getItem(getStorageKey(dayIndex, period)) || "{}");
    } catch {
      return {};
    }
  }

  function toggleStep(stepId) {
    const key = getStorageKey(selectedDay, selectedPeriod);
    const map = getCompletedMap(selectedDay, selectedPeriod);
    map[stepId] = !map[stepId];
    localStorage.setItem(key, JSON.stringify(map));
    render();
  }

  function startCountdown(btn, seconds) {
    if (activeTimerInterval) clearInterval(activeTimerInterval);
    let remaining = seconds;
    const updateLabel = () => {
      const m = Math.floor(remaining / 60);
      const s = String(remaining % 60).padStart(2, "0");
      btn.textContent = `⏳ Absorbing: ${m}:${s}`;
    };
    updateLabel();
    activeTimerInterval = setInterval(() => {
      remaining--;
      if (remaining <= 0) {
        clearInterval(activeTimerInterval);
        btn.textContent = "✅ Ready for Aloe Vera Gel!";
        if (navigator.vibrate) navigator.vibrate([150, 80, 150]);
      } else {
        updateLabel();
      }
    }, 1000);
  }

  function render() {
    if (activeTimerInterval) clearInterval(activeTimerInterval);

    const data = getRoutineData(selectedDay, selectedPeriod);
    const completed = getCompletedMap(selectedDay, selectedPeriod);

    const badgeEl = document.getElementById("routineBadge");
    badgeEl.textContent = data.badge;
    badgeEl.className = "time-badge" + (data.isBha ? " bha-night" : "");

    document.getElementById("liveIndicator").textContent = isLive ? "Live Auto" : "Preview Mode";
    document.getElementById("routineTitle").textContent = data.title;
    document.getElementById("routineSubtitle").textContent = data.subtitle;

    const container = document.getElementById("stepsContainer");
    container.innerHTML = "";

    data.steps.forEach((step) => {
      const isDone = !!completed[step.id];
      const row = document.createElement("div");
      row.className = "step" + (isDone ? " completed" : "");
      row.onclick = () => toggleStep(step.id);

      const box = document.createElement("div");
      box.className = "checkbox";
      box.textContent = isDone ? "✓" : "";

      const content = document.createElement("div");
      content.className = "step-content";

      const title = document.createElement("div");
      title.className = "step-title";
      title.textContent = step.title;

      const desc = document.createElement("div");
      desc.className = "step-desc";
      desc.textContent = step.desc;

      content.appendChild(title);
      content.appendChild(desc);

      if (step.timerSec) {
        const tBtn = document.createElement("button");
        tBtn.className = "timer-btn";
        const mins = step.timerSec / 60;
        tBtn.textContent = `⏱ Start ${mins}-Min Wait Timer`;
        tBtn.onclick = (e) => {
          e.stopPropagation();
          startCountdown(tBtn, step.timerSec);
        };
        content.appendChild(tBtn);
      }

      row.appendChild(box);
      row.appendChild(content);
      container.appendChild(row);
    });

    // Day pills
    const pillsContainer = document.getElementById("dayPills");
    pillsContainer.innerHTML = "";
    DAYS.forEach((d, idx) => {
      const btn = document.createElement("button");
      btn.className = "pill" + (idx === selectedDay ? " active" : "");
      btn.textContent = d;
      btn.onclick = () => {
        isLive = false;
        selectedDay = idx;
        render();
      };
      pillsContainer.appendChild(btn);
    });

    document.getElementById("amBtn").className = "ampm-btn" + (selectedPeriod === "AM" ? " active" : "");
    document.getElementById("pmBtn").className = "ampm-btn" + (selectedPeriod === "PM" ? " active" : "");
  }

  function syncToLiveClock() {
    const live = getEffectiveDayAndPeriod();
    selectedDay = live.day;
    selectedPeriod = live.period;
    isLive = true;
    render();
  }

  document.getElementById("amBtn").onclick = () => {
    isLive = false;
    selectedPeriod = "AM";
    render();
  };

  document.getElementById("pmBtn").onclick = () => {
    isLive = false;
    selectedPeriod = "PM";
    render();
  };

  document.getElementById("syncNowBtn").onclick = syncToLiveClock;

  // Auto-refresh when waking phone or every 60 seconds if in Live mode
  setInterval(() => {
    if (isLive) syncToLiveClock();
  }, 60000);

  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && isLive) syncToLiveClock();
  });

  syncToLiveClock();
</script>
</body>
</html>
